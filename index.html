<title>HueHue</title>
<style>
  :root { --ink: #111; --paper: #fff; --muted: #555; --line: #ddd; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eee; --paper: #111; --muted: #aaa; --line: #333; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 32px; margin: 0 0 4px; }
  h2 { font-size: 20px; margin: 36px 0 8px; border-top: 2px solid var(--ink); padding-top: 16px; }
  .muted { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
<h1>HueHue</h1>
<p>One colour a day. Find it, shoot it.</p>
