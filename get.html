<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get HueHue</title>
<style>
  body { font-family: system-ui, sans-serif; background: #edece7; color: #141414; text-align: center; padding: 64px 16px; }
  a { display: block; max-width: 320px; margin: 16px auto; padding: 16px; border-radius: 12px; background: #141414; color: #fff; text-decoration: none; font-weight: 700; }
</style>
<script>
  // Link della bio di Instagram: il browser interno non apre play.google.com, quindi su Android si passa dall'intent del Play Store
  var play = 'https://play.google.com/store/apps/details?id=huehue.myapp';
  var ua = navigator.userAgent;
  if (/android/i.test(ua)) {
    location.href = 'intent://details?id=huehue.myapp#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  } else if (/iphone|ipad|ipod/i.test(ua)) {
    location.href = 'https://apps.apple.com/app/id6820775255';
  }
</script>
</head>
<body>
  <h1>HueHue</h1>
  <a href="https://apps.apple.com/app/id6820775255">Download on the App Store</a>
  <a href="https://play.google.com/store/apps/details?id=huehue.myapp">Get it on Google Play</a>
</body>
</html>
